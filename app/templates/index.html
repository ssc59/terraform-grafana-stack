<!DOCTYPE html>

<html>

<head>

    <title>TEAM02 Provisioning Portal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="card">

<h1>TEAM02 User Provisioning</h1>

<p>Create a new RACF user and launch the provisioning workflow.</p>

<form action="/create-user" method="post">

<label>User ID</label>
<input
    type="text"
    name="user_id"
    required
>

<label>Full Name</label>
<input
    type="text"
    name="name"
    required
>

<label>Account</label>
<input
    type="text"
    name="account"
    value="ACCT001"
    required
>

<label>Procedure</label>
<input
    type="text"
    name="procedure"
    value="DB13PROC"
    required
>

<button>Create User</button>

</form>

</div>

</body>

</html>
