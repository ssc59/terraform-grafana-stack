---
- name: Deploy Flask application from Amazon ECR
  hosts: frontend
  become: true
  gather_facts: true

  vars:
    docker_app_name: terraform-docker-app
    docker_app_port: 5000
    docker_sdk_venv: /opt/docker-sdk-venv

  tasks:
    - name: Confirm required deployment variables are present
      ansible.builtin.assert:
        that:
          - ecr_registry is defined
          - ecr_registry | length > 0
          - docker_image is defined
          - docker_image | length > 0
          - ecr_password is defined
          - ecr_password | length > 0
          - database_url is defined
          - database_url | length > 0
        fail_msg: Required ECR deployment information is missing.

    - name: Ensure Docker is installed
      ansible.builtin.package:
        name: docker
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure Python pip is installed
      ansible.builtin.package:
        name: python3-pip
        state: present

    - name: Create Docker SDK virtual environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ docker_sdk_venv }}"
        creates: "{{ docker_sdk_venv }}/bin/python"

    - name: Install Docker SDK in virtual environment
      ansible.builtin.pip:
        name: docker
        state: present
        executable: "{{ docker_sdk_venv }}/bin/pip"

    - name: Verify Docker socket exists
      ansible.builtin.stat:
        path: /var/run/docker.sock
      register: docker_socket

    - name: Fail if Docker socket is unavailable
      ansible.builtin.assert:
        that:
          - docker_socket.stat.exists
        fail_msg: Docker is installed, but /var/run/docker.sock is unavailable.

    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: /home/ec2-user/.ssh
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0700"

    - name: Copy z/OS SSH key
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../zos-ansible/id_rsa"
        dest: /home/ec2-user/.ssh/zos_id_rsa
        owner: ec2-user
        group: ec2-user
        mode: "0600"

    - name: Deploy container using Docker SDK virtual environment
      vars:
        ansible_python_interpreter: "{{ docker_sdk_venv }}/bin/python"

      block:
        - name: Log in to Amazon ECR
          ansible.builtin.command:
            cmd: "docker login --username AWS --password-stdin {{ ecr_registry }}"
            stdin: "{{ ecr_password }}"
          changed_when: true
          no_log: true

        - name: Pull Docker application image
          community.docker.docker_image:
            name: "{{ docker_image }}"
            source: pull
            force_source: true

        - name: Run Docker application container
          community.docker.docker_container:
            name: "{{ docker_app_name }}"
            image: "{{ docker_image }}"
            state: started
            restart_policy: unless-stopped
            recreate: true
            pull: false
            published_ports:
              - "{{ docker_app_port }}:5000"
            env:
              DATABASE_URL: "{{ database_url }}"
            volumes:
              - "docker_app_data:/workspace/app/data"
              - "/home/ec2-user/.ssh/zos_id_rsa:/workspace/zos-ansible/id_rsa:ro"

    - name: Wait for application port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ docker_app_port }}"
        delay: 2
        timeout: 60

    - name: Display deployment result
      ansible.builtin.debug:
        msg: >-
          {{ docker_app_name }} is running from {{ docker_image }}
          on port {{ docker_app_port }}.