name: Docker App Build and Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "docker-app/**"
      - "playbooks/deploy_docker_app.yml"
      - "inventory/**"
      - ".github/workflows/docker-app-deploy.yml"

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

  # Change this only if your ECR repository has a different name.
  ECR_REPOSITORY: docker-app

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    outputs:
      docker_image: ${{ steps.image-info.outputs.docker_image }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Verify AWS account
        run: |
          aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Docker image information
        id: image-info
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          DOCKER_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "ECR registry: ${ECR_REGISTRY}"
          echo "Docker image: ${DOCKER_IMAGE}"

          echo "docker_image=${DOCKER_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.image-info.outputs.docker_image }}" \
            --tag "${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:latest" \
            docker-app

      - name: Test Docker image
        run: |
          docker run \
            --detach \
            --name docker-app-test \
            --publish 5000:5000 \
            "${{ steps.image-info.outputs.docker_image }}"

          sleep 5

          curl \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            http://localhost:5000/health

      - name: Stop test container
        if: always()
        run: |
          docker rm --force docker-app-test 2>/dev/null || true

      - name: Push Docker image
        run: |
          docker push "${{ steps.image-info.outputs.docker_image }}"

          docker push \
            "${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:latest"

  deploy-with-ansible:
    name: Deploy image with Ansible
    runs-on: ubuntu-latest
    needs:
      - build-and-push

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
      DOCKER_IMAGE: ${{ needs.build-and-push.outputs.docker_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Install Ansible and AWS dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            ansible \
            boto3 \
            botocore

          ansible-galaxy collection install \
            amazon.aws \
            community.docker

      - name: Fetch SSH key from SSM
        run: |
          mkdir -p .keys

          aws ssm get-parameter \
            --name "/monitoring/ssh-private-key" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text \
            --region "${AWS_DEFAULT_REGION}" \
            > .keys/monitoring.pem

          chmod 600 .keys/monitoring.pem

      - name: Verify deployment credentials
        run: |
          echo "AWS account used by GitHub Actions:"

          aws sts get-caller-identity \
            --query "Account" \
            --output text

          echo "SSH key fingerprint:"

          ssh-keygen -y \
            -f .keys/monitoring.pem |
          ssh-keygen -lf -

      - name: Get temporary ECR password
        run: |
          ECR_PASSWORD="$(
            aws ecr get-login-password \
              --region "${AWS_DEFAULT_REGION}"
          )"

          echo "::add-mask::${ECR_PASSWORD}"
          echo "ECR_PASSWORD=${ECR_PASSWORD}" >> "$GITHUB_ENV"

      - name: Verify dynamic inventory
        run: |
          ansible-inventory \
            -i ansible/inventory/aws_ec2.yml \
            --graph

      - name: Get frontend public IP
        run: |
          FRONTEND_IP="$(
            ansible-inventory \
              -i ansible/inventory/aws_ec2.yml \
              --list |
            python -c '
          import json
          import sys

          inventory = json.load(sys.stdin)

          frontend_hosts = inventory.get("frontend", {}).get("hosts", [])

          if not frontend_hosts:
              raise SystemExit(
                  "No frontend hosts were found in the dynamic inventory."
              )

          host = frontend_hosts[0]
          variables = inventory.get("_meta", {}).get(
              "hostvars",
              {}
          ).get(host, {})

          frontend_ip = (
              variables.get("ansible_host")
              or variables.get("public_ip_address")
              or variables.get("public_ip")
              or host
          )

          print(frontend_ip)
          '
          )"

          echo "Frontend public IP: ${FRONTEND_IP}"
          echo "FRONTEND_IP=${FRONTEND_IP}" >> "$GITHUB_ENV"

      - name: Test SSH directly
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -i "$(pwd)/.keys/monitoring.pem" \
            "ec2-user@${FRONTEND_IP}" \
            "echo Direct SSH connection succeeded"

      - name: Test frontend connectivity with Ansible
        run: |
          ansible \
            -i ansible/inventory/aws_ec2.yml \
            frontend \
            -m ping \
            -e "ansible_user=ec2-user" \
            -e "ansible_private_key_file=$(pwd)/.keys/monitoring.pem" \
            -e "ansible_ssh_common_args=-o StrictHostKeyChecking=no -o IdentitiesOnly=yes"

      - name: Deploy Docker application
        run: |
          ansible-playbook \
            -i ansible/inventory/aws_ec2.yml \
            playbooks/deploy_docker_app.yml \
            -e "ansible_user=ec2-user" \
            -e "ansible_private_key_file=$(pwd)/.keys/monitoring.pem" \
            -e "ansible_ssh_common_args=-o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            -e "ecr_registry=${ECR_REGISTRY}" \
            -e "ecr_password=${ECR_PASSWORD}" \
            -e "docker_image=${DOCKER_IMAGE}"

      - name: Verify application health
        run: |
          echo "Testing http://${FRONTEND_IP}:5000/health"

          curl \
            --fail \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            "http://${FRONTEND_IP}:5000/health"