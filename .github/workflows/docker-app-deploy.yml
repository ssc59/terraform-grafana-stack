name: Docker App Build and Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "ansible/playbooks/deploy_docker_app.yml"
      - "ansible/inventory/**"
      - "terraform/**"
      - ".github/workflows/docker-app-deploy.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  ECR_REPOSITORY: docker-app

jobs:
  terraform-apply:
    name: Create EC2 Infrastructure
    runs-on: ubuntu-latest

    env:
      TF_VAR_aws_region: ${{ secrets.AWS_DEFAULT_REGION }}
      TF_VAR_instance_type: "t3.micro"
      TF_VAR_project_tag: "monitoring"
      TF_VAR_frontend_role_tag: "frontend"
      TF_VAR_backend_role_tag: "backend"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::699475916440:role/team02-actions-deploy
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          role-session-name: GitHubActions
          allowed-account-ids: 699475916440

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=monitoring/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"

      - name: Terraform apply
        run: |
          terraform -chdir=terraform apply \
            -input=false \
            -auto-approve

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - terraform-apply

    outputs:
      docker_image: ${{ steps.image-info.outputs.docker_image }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::699475916440:role/team02-actions-deploy
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          role-session-name: GitHubActions
          allowed-account-ids: 699475916440

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify AWS account and region
        run: |
          echo "AWS account:"
          aws sts get-caller-identity --query Account --output text

          echo "AWS region:"
          echo "${AWS_DEFAULT_REGION}"

      - name: Ensure ECR repository exists
        run: |
          if aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_DEFAULT_REGION}" >/dev/null 2>&1
          then
            echo "ECR repository ${ECR_REPOSITORY} already exists."
          else
            echo "Creating ECR repository ${ECR_REPOSITORY}."

            aws ecr create-repository \
              --repository-name "${ECR_REPOSITORY}" \
              --region "${AWS_DEFAULT_REGION}" \
              --image-scanning-configuration scanOnPush=true
          fi

          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_DEFAULT_REGION}" \
            --query "repositories[0].repositoryUri" \
            --output text

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Docker image information
        id: image-info
        shell: bash
        run: |
          set -euo pipefail

          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          DOCKER_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "docker_image=${DOCKER_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${LATEST_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "ECR registry: ${ECR_REGISTRY}"
          echo "Docker image: ${DOCKER_IMAGE}"
          echo "Latest image: ${LATEST_IMAGE}"

      - name: Build Docker image
        run: |
          docker build \
            --file app/Dockerfile \
            --tag "${{ steps.image-info.outputs.docker_image }}" \
            --tag "${{ steps.image-info.outputs.latest_image }}" \
            .

      - name: Push Docker images to ECR
        run: |
          docker push "${{ steps.image-info.outputs.docker_image }}"
          docker push "${{ steps.image-info.outputs.latest_image }}"

  deploy-with-ansible:
    name: Deploy Docker Image with Ansible
    runs-on: ubuntu-latest
    needs:
      - build-and-push

    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      ECR_REPOSITORY: docker-app
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::699475916440:role/team02-actions-deploy
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          role-session-name: GitHubActions
          allowed-account-ids: 699475916440

      - name: Install Ansible and AWS dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            ansible \
            boto3 \
            botocore

          ansible-galaxy collection install \
            amazon.aws \
            community.docker

      - name: Verify required repository files
        run: |
          test -f ansible/inventory/aws_ec2.yml
          test -f ansible/playbooks/deploy_docker_app.yml

          echo "Required Ansible files exist."

      - name: Fetch SSH key from SSM
        run: |
          mkdir -p .keys

          aws ssm get-parameter \
            --name "/monitoring/ssh-private-key" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text \
            --region "${AWS_DEFAULT_REGION}" \
            > .keys/monitoring.pem

          chmod 600 .keys/monitoring.pem

          test -s .keys/monitoring.pem

      - name: Verify deployment credentials
        run: |
          echo "AWS account used by GitHub Actions:"

          aws sts get-caller-identity \
            --query "Account" \
            --output text

          echo "SSH private key fingerprint:"

          ssh-keygen -y \
            -f .keys/monitoring.pem |
          ssh-keygen -lf -

      - name: Set ECR deployment information
        shell: bash
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          DOCKER_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          ECR_PASSWORD="$(
            aws ecr get-login-password \
              --region "${AWS_DEFAULT_REGION}"
          )"

          if [[ -z "${AWS_ACCOUNT_ID}" ]]; then
            echo "AWS account ID is empty."
            exit 1
          fi

          if [[ -z "${ECR_REGISTRY}" ]]; then
            echo "ECR_REGISTRY is empty."
            exit 1
          fi

          if [[ -z "${DOCKER_IMAGE}" ]]; then
            echo "DOCKER_IMAGE is empty."
            exit 1
          fi

          if [[ -z "${ECR_PASSWORD}" ]]; then
            echo "ECR_PASSWORD is empty."
            exit 1
          fi

          echo "::add-mask::${ECR_PASSWORD}"

          {
            echo "ECR_REGISTRY=${ECR_REGISTRY}"
            echo "DOCKER_IMAGE=${DOCKER_IMAGE}"
            echo "ECR_PASSWORD=${ECR_PASSWORD}"
          } >> "$GITHUB_ENV"

          echo "ECR registry: ${ECR_REGISTRY}"
          echo "Docker image: ${DOCKER_IMAGE}"

      - name: Verify dynamic inventory
        run: |
          ansible-inventory \
            -i ansible/inventory/aws_ec2.yml \
            --graph

      - name: Get frontend host
        shell: bash
        run: |
          set -euo pipefail

          ansible-inventory \
            -i ansible/inventory/aws_ec2.yml \
            --list \
            > /tmp/aws-inventory.json

          FRONTEND_HOST="$(
            python - <<'PY'
          import json
          import re

          with open("/tmp/aws-inventory.json", encoding="utf-8") as file:
              inventory = json.load(file)

          frontend_hosts = inventory.get("frontend", {}).get("hosts", [])

          if not frontend_hosts:
              raise SystemExit(
                  "No frontend hosts were found in the dynamic inventory."
              )

          frontend_host = str(frontend_hosts[0]).strip()

          if not frontend_host:
              raise SystemExit("The frontend hostname is empty.")

          if not re.fullmatch(r"[A-Za-z0-9.-]+", frontend_host):
              raise SystemExit(
                  f"The frontend hostname contains invalid characters: "
                  f"{frontend_host!r}"
              )

          print(frontend_host, end="")
          PY
          )"

          if [[ -z "${FRONTEND_HOST}" ]]
          then
            echo "Frontend hostname is empty."
            exit 1
          fi

          echo "Frontend host: [${FRONTEND_HOST}]"
          printf 'FRONTEND_HOST=%s\n' "${FRONTEND_HOST}" >> "$GITHUB_ENV"

      - name: Test SSH directly
        shell: bash
        run: |
          set -euo pipefail

          echo "Connecting to ec2-user@${FRONTEND_HOST}"

          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -i "${GITHUB_WORKSPACE}/.keys/monitoring.pem" \
            "ec2-user@${FRONTEND_HOST}" \
            "echo Direct SSH connection succeeded"

      - name: Test frontend connectivity with Ansible
        shell: bash
        run: |
          set -euo pipefail

          ansible \
            frontend \
            -i ansible/inventory/aws_ec2.yml \
            -m ansible.builtin.ping \
            -u ec2-user \
            --private-key "${GITHUB_WORKSPACE}/.keys/monitoring.pem" \
            --ssh-common-args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes"

      - name: Create z/OS SSH key
        shell: bash
        run: |
          cat > zos-ansible/id_rsa << 'EOF'
          ${{ secrets.ID_RSA }}
          EOF
          chmod 600 zos-ansible/id_rsa

      - name: Verify z/OS SSH key
        run: |
          pwd
          ls -l zos-ansible
          test -f zos-ansible/id_rsa
          stat zos-ansible/id_rsa

      - name: Deploy Docker application
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying image: ${DOCKER_IMAGE}"
          echo "Using registry: ${ECR_REGISTRY}"

          ansible-playbook \
            -i ansible/inventory/aws_ec2.yml \
            ansible/playbooks/deploy_docker_app.yml \
            -u ec2-user \
            --private-key "${GITHUB_WORKSPACE}/.keys/monitoring.pem" \
            --ssh-common-args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes" \
            -e "ecr_registry=${ECR_REGISTRY}" \
            -e "ecr_username=AWS" \
            -e "ecr_password=${ECR_PASSWORD}" \
            -e "docker_image=${DOCKER_IMAGE}" \
            -e "database_url=${DATABASE_URL}"

      - name: Remove downloaded SSH key
        if: always()
        run: |
          rm -f .keys/monitoring.pem