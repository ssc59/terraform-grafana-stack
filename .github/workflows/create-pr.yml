name: Create Pull Request

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check for existing pull request
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head development \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          echo "count=$PR_COUNT" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.existing-pr.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head development \
            --title "Merge development into main" \
            --body "Automatically created after a push to the development branch."