name: TruffleHog

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  trufflehog:
    name: truffel hog test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          extra_args: --results=verified,unknown

  merge:
    name: Merge into main
    needs: trufflehog
    runs-on: ubuntu-latest

    # Only merge PRs created from branches in this repository.
    # This prevents untrusted fork PRs from being automatically merged.
    if: >
      github.event.pull_request.head.repo.full_name ==
      github.repository

    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch