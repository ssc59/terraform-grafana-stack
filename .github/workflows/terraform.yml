name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

  TF_VAR_aws_region: ${{ secrets.AWS_DEFAULT_REGION }}
  TF_VAR_instance_type: "t3.micro"
  TF_VAR_project_tag: "terraform-grafana-stack"
  TF_VAR_frontend_role_tag: "frontend"
  TF_VAR_backend_role_tag: "backend"

  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Test required AWS permissions
        run: |
          echo "Testing EC2 permissions..."
          aws ec2 describe-images \
            --owners amazon \
            --filters \
              "Name=name,Values=al2023-ami-2023*-x86_64" \
              "Name=virtualization-type,Values=hvm" \
            --max-items 1 > /dev/null

          aws ec2 describe-vpcs --max-results 5 > /dev/null
          aws ec2 describe-subnets --max-results 5 > /dev/null
          aws ec2 describe-security-groups --max-results 5 > /dev/null

          echo "Testing SSM permissions..."
          aws ssm describe-parameters --max-results 5 > /dev/null

          echo "AWS permission tests passed."

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        if: inputs.action == 'plan'
        timeout-minutes: 5
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        if: inputs.action == 'apply'
        timeout-minutes: 20
        run: terraform apply -no-color -input=false -auto-approve

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        timeout-minutes: 20
        run: terraform destroy -no-color -input=false -auto-approve
